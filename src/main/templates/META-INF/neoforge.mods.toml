
modLoader="javafml"
loaderVersion="${loader_version_range}"

license="${mod_license}"
issueTrackerURL="https://github.com/Jojoaky/Substance/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://modrinth.com/project/EiAqNYtB"
logoFile="assets/substance/banner.png"
authors="Jojoaky, Zute"

description='''
Substance adds fictional consumables, smokables, questionable chemistry, and items inspired by Breaking Bad. Create integration adds automation recipes when Create is installed.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0.8,)"
    ordering="AFTER"
    side="BOTH"
